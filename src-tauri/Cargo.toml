[package]
name = "spectrum-agent"
version = "0.1.0"
edition = "2024"
publish = false

[features]
test-probes = []

[[bin]]
name = "supervisor-stub"
path = "src/bin/supervisor_stub.rs"
required-features = ["test-probes"]

[lib]
name = "spectrum_agent"
path = "src/lib.rs"

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
