[package]
name = "spectrum-agent"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "spectrum-agent"

[[bin]]
name = "spectrum-agent"
path = "src/main.rs"

[features]
test-probes = []
# Managed explicitly by the CLI: production builds must enable custom-protocol.
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "supervisor-stub"
path = "src/bin/supervisor_stub.rs"
required-features = ["test-probes"]

[[bin]]
name = "supervisor-probe"
path = "src/bin/supervisor_probe.rs"
required-features = ["test-probes"]

[lib]
name = "spectrum_agent"
path = "src/lib.rs"

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
tauri = { version = "=2.12.4", default-features = false, features = ["wry", "compression", "common-controls-v6", "dynamic-acl"] }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-dialog = "=2.8.3"

[build-dependencies]
tauri-build = { version = "=2.7.3", default-features = false, features = ["config-json"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "=2.5.4"
